<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0e0c">
<title>Nuova password · VORTICE</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body class="centered">

<main class="card">
  <a class="brand-mark" href="/">VORTICE</a>
  <p class="kicker">Recupero accesso</p>
  <h1>Scegli una nuova password</h1>
  <div class="rule"></div>
  <p class="lead">Cambiarla chiude tutte le sessioni aperte altrove.</p>

  <p class="notice notice--bad" id="formErr" hidden role="alert"></p>

  <form id="resetForm" novalidate>
    <div class="field">
      <label for="password">Nuova password</label>
      <input id="password" type="password" autocomplete="new-password" required placeholder="••••••••••">
      <p class="hint">Almeno 10 caratteri.</p>
      <p class="err" id="passwordErr" hidden></p>
    </div>
    <div class="field">
      <label for="confirm">Ripeti la password</label>
      <input id="confirm" type="password" autocomplete="new-password" required placeholder="••••••••••">
      <p class="err" id="confirmErr" hidden></p>
    </div>
    <button class="btn btn--block" type="submit" id="submitBtn">Imposta la password</button>
  </form>

  <div class="card-foot">
    <a href="/accedi.html">Torna all'accesso</a>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/reset-page.js"></script>
</body>
</html>
